name: Apply mandatory break reminder patch

on:
  push:
    branches:
      - feat/mandatory-break-modal-20260820
    paths:
      - scripts/patch-mandatory-break.py
      - .github/workflows/apply-mandatory-break-patch.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mandatory-break-modal-20260820
          fetch-depth: 0

      - name: Apply focused source patch
        run: python3 scripts/patch-mandatory-break.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify production build
        run: npm run build

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx types.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add age-based mandatory break popup"
          git push origin HEAD:feat/mandatory-break-modal-20260820

# trigger after workflow registration
