name: Runtime Smoke

on:
  push:
  pull_request:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install app dependencies
        run: npm install
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build normal production bundle
        run: npm run build
      - name: Start normal production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/onesip-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-vite.log
          exit 1
      - name: Check login runtime in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3000);
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            const rootText = await page.locator('#root').innerText().catch(() => '');
            console.log('HTTP status:', response && response.status());
            console.log('Root text:', rootText.slice(0, 1600));
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (!rootText.trim()) fatalErrors.push('App root is blank');
            if (!/ONESIP|登录|Login/i.test(rootText)) fatalErrors.push('Login shell not found');
            if (fatalErrors.length) {
              console.error('\nLOGIN RUNTIME SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-login-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('LOGIN RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build CI-only logged-in staff bundle
        run: RUNTIME_STAFF_SMOKE=1 npm run build
      - name: Start staff production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/onesip-staff-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-staff-vite.log
          exit 1
      - name: Check logged-in staff + responsibility UI in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            await page.addInitScript(() => {
              const OriginalDate = Date;
              const fixedNow = OriginalDate.parse('2026-08-22T11:30:00Z');
              class FixedDate extends OriginalDate {
                constructor(...args) { super(...(args.length ? args : [fixedNow])); }
                static now() { return fixedNow; }
              }
              FixedDate.parse = OriginalDate.parse;
              FixedDate.UTC = OriginalDate.UTC;
              window.Date = FixedDate;
            });
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4174/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3500);
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            const rootText = await page.locator('#root').innerText().catch(() => '');
            console.log('HTTP status:', response && response.status());
            console.log('Staff root text:', rootText.slice(0, 6000));
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (!rootText.trim()) fatalErrors.push('Staff app root is blank');
            if (!/ONESIP/i.test(rootText)) fatalErrors.push('ONESIP staff shell not found');
            if (!/ONESIP Shift Responsibility|本班责任|周六早班|Sat Opening/i.test(rootText)) fatalErrors.push('Mandatory weekend responsibility UI did not render for same-day pre-shift open');
            if (!/我的班次责任|My Shift Duties/i.test(rootText)) fatalErrors.push('Always-visible staff responsibility library entry did not render');
            if (!/Topping Replacement Rule/i.test(rootText)) fatalErrors.push('Staff topping replacement notice did not render');
            if (!/早班食品安全检查|Opening Food Safety Check/i.test(rootText)) fatalErrors.push('Opening food safety gate did not render for earliest-start staff');
            if (!(await page.locator('[data-testid="recipe-update-gate"]').count())) fatalErrors.push('Mandatory recipe update did not render for staff');
            const staffRecipeGateText = await page.locator('[data-testid="recipe-update-gate"]').innerText().catch(() => '');
            if (!/Passion Fruit/.test(staffRecipeGateText) || !/Taro Premix/.test(staffRecipeGateText) || !/Earl Grey/.test(staffRecipeGateText)) fatalErrors.push('Staff recipe notice missing October 20 updates');
            if (/400g|400克/.test(staffRecipeGateText)) fatalErrors.push('Suspended Coconut 400g notice still visible');
            if (fatalErrors.length) {
              console.error('\nSTAFF RUNTIME SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-staff-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('STAFF RESPONSIBILITY + TOPPING NOTICE RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build CI-only manager bundle
        run: RUNTIME_MANAGER_SMOKE=1 npm run build
      - name: Start manager production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/onesip-manager-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-manager-vite.log
          exit 1
      - name: Check manager topping notice in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4175/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3500);
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            const rootText = await page.locator('#root').innerText().catch(() => '');
            console.log('HTTP status:', response && response.status());
            console.log('Manager root text:', rootText.slice(0, 6000));
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (!rootText.trim()) fatalErrors.push('Manager app root is blank');
            if (!/班次责任|Shift Duties/i.test(rootText)) fatalErrors.push('Manager responsibility library entry did not render');
            if (!/Topping Replacement Rule/i.test(rootText)) fatalErrors.push('Manager topping replacement notice did not render');

            const recipeGate = page.locator('[data-testid="recipe-update-gate"]');
            if (!(await recipeGate.count())) {
              fatalErrors.push('Mandatory recipe quiz did not show in Manager/Admin');
            } else {
              const confirmQuiz = page.locator('[data-testid="recipe-update-confirm"]');
              if (await confirmQuiz.isEnabled()) fatalErrors.push('Quiz confirmation enabled before reading');
              await page.locator('[data-testid="recipe-update-lang-en"]').click();
              const englishContent = await recipeGate.innerText();
              if (!/Important Recipe Changes/i.test(englishContent) || !/Passion Fruit/.test(englishContent) || !/Tea Jelly/.test(englishContent) || !/Taro Premix/.test(englishContent) || !/Earl Grey/.test(englishContent) || !/No\. 3/.test(englishContent) || /400g/.test(englishContent)) {
                fatalErrors.push('English recipe updates missing');
              }
              await page.locator('[data-testid="recipe-update-lang-zh"]').click();
              const chineseContent = await recipeGate.innerText();
              if (!/芒果果肉旁边/.test(chineseContent) || !/玻璃滑盖下面/.test(chineseContent) || !/10 号罐/.test(chineseContent) || !/Masala/.test(chineseContent) || !/3 号罐/.test(chineseContent)) {
                fatalErrors.push('Chinese placement and prep updates missing');
              }
              const correctAnswerIndexes = [1, 0, 2, 1, 2, 0, 1, 2, 1];
              for (let i = 0; i < correctAnswerIndexes.length; i++) {
                await page.locator('[data-testid="recipe-update-answer-' + i + '-' + (i === 0 ? 0 : correctAnswerIndexes[i]) + '"]').check();
              }
              if (await confirmQuiz.isEnabled()) fatalErrors.push('Wrong quiz answer allowed confirmation');
              await page.locator('[data-testid="recipe-update-answer-0-1"]').check();
              if (await confirmQuiz.isEnabled()) fatalErrors.push('Reading timer not enforced');
              await page.waitForTimeout(36000);
              if (!(await confirmQuiz.isEnabled())) fatalErrors.push('Correct quiz answers did not unlock confirmation');
              else await confirmQuiz.click();
              await page.waitForTimeout(250);
              if (await recipeGate.count()) fatalErrors.push('Mandatory recipe quiz remained after completion');
              await page.reload({ waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(1500);
              if (await recipeGate.count()) fatalErrors.push('Recipe quiz appeared again after acknowledgement on reload');
            }

            const gotIt = page.getByRole('button', { name: /Got it|知道了|明白了/i });
            if (await gotIt.count()) await gotIt.first().click().catch(() => {});
            const managerModeButton = page.getByRole('button', { name: /Manager Mode/i });
            if (!(await managerModeButton.count())) {
              fatalErrors.push('Manager Mode entry not found');
            } else {
              await managerModeButton.first().evaluate((el) => el.click());
              await page.waitForTimeout(300);
              const scheduleTab = page.getByRole('button', { name: /^schedule$/i });
              if (!(await scheduleTab.count())) {
                fatalErrors.push('Manager schedule tab not found');
              } else {
                await scheduleTab.first().evaluate((el) => el.click());
                await page.waitForTimeout(350);
                const exportButton = page.locator('[data-testid="export-schedule-open"]');
                if (!(await exportButton.count())) {
                  fatalErrors.push('Schedule export button did not render');
                } else {
                  await exportButton.evaluate((el) => el.click());
                  await page.waitForTimeout(200);
                  if (!(await page.locator('[data-testid="export-schedule-dialog"]').count())) fatalErrors.push('Schedule export dialog did not open');
                  if (!(await page.locator('[data-testid="export-schedule-week"]').count())) fatalErrors.push('Weekly export preset missing');
                  if (!(await page.locator('[data-testid="export-schedule-month"]').count())) fatalErrors.push('Monthly export preset missing');
                  if (!(await page.locator('[data-testid="export-schedule-custom"]').count())) fatalErrors.push('Custom export preset missing');
                }
              }
            }
            if (fatalErrors.length) {
              console.error('\nMANAGER RUNTIME SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-manager-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('MANAGER RESPONSIBILITY + TOPPING NOTICE RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build CI-only owner bundle
        run: RUNTIME_OWNER_SMOKE=1 npm run build
      - name: Start owner production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4176 > /tmp/onesip-owner-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-owner-vite.log
          exit 1
      - name: Check owner topping notice in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4176/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3500);
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            const rootText = await page.locator('#root').innerText().catch(() => '');
            console.log('HTTP status:', response && response.status());
            console.log('Owner root text:', rootText.slice(0, 6000));
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (!rootText.trim()) fatalErrors.push('Owner app root is blank');
            if (!/Topping Replacement Rule/i.test(rootText)) fatalErrors.push('Owner topping replacement notice did not render');
            if (!(await page.locator('[data-testid="recipe-update-gate"]').count())) fatalErrors.push('Mandatory recipe update did not render for owner');
            if (fatalErrors.length) {
              console.error('\nOWNER RUNTIME SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-owner-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('OWNER TOPPING NOTICE RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build CI-only editor bundle
        run: RUNTIME_EDITOR_SMOKE=1 npm run build
      - name: Start editor production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4177 > /tmp/onesip-editor-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-editor-vite.log
          exit 1
      - name: Check 0413 recipe search in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4177/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3000);
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            const editorRecipeGate = page.locator('[data-testid="recipe-update-gate"]');
            if (!(await editorRecipeGate.count())) {
              fatalErrors.push('Mandatory recipe quiz did not show in Editor/Admin');
            } else {
              const correctAnswerIndexes = [1, 0, 2, 1, 2, 0, 1, 2, 1];
              for (let i = 0; i < correctAnswerIndexes.length; i++) await page.locator('[data-testid="recipe-update-answer-' + i + '-' + correctAnswerIndexes[i] + '"]').check();
              const confirmQuiz = page.locator('[data-testid="recipe-update-confirm"]');
              if (await confirmQuiz.isEnabled()) fatalErrors.push('Editor quiz bypassed reading timer');
              await page.waitForTimeout(36000);
              if (!(await confirmQuiz.isEnabled())) fatalErrors.push('Editor quiz remained locked despite correct answers and timer');
              else await confirmQuiz.click();
              if (await editorRecipeGate.count()) fatalErrors.push('Editor quiz remained after completion');
            }
            const recipesButton = page.getByRole('button', { name: /^recipes$/i });
            if (!(await recipesButton.count())) fatalErrors.push('Editor recipes tab not found');
            else await recipesButton.first().click();
            await page.waitForTimeout(500);
            const search = page.locator('[data-testid="editor-recipe-search"]');
            if (!(await search.count())) fatalErrors.push('0413 recipe search input did not render');
            else {
              await search.fill('___NO_RECIPE_SHOULD_MATCH___');
              await page.waitForTimeout(250);
              const editorText = await page.locator('#root').innerText().catch(() => '');
              if (!/0 results/i.test(editorText)) fatalErrors.push('Recipe search did not filter to zero results');
            }
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (fatalErrors.length) {
              console.error('\nEDITOR RECIPE SEARCH SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-editor-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('0413 EDITOR RECIPE SEARCH RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Build CI-only closing food safety bundle
        run: RUNTIME_FOOD_SAFETY_CLOSING_SMOKE=1 npm run build
      - name: Start closing food safety preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4178 > /tmp/onesip-food-safety-closing-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4178/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/onesip-food-safety-closing-vite.log
          exit 1
      - name: Check closing food safety role in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const fatalErrors = [];
            page.on('pageerror', err => fatalErrors.push(err.stack || err.message || String(err)));
            await page.addInitScript(() => {
              const OriginalDate = Date;
              const fixedNow = OriginalDate.parse('2026-09-18T18:30:00Z');
              class FixedDate extends OriginalDate {
                constructor(...args) { super(...(args.length ? args : [fixedNow])); }
                static now() { return fixedNow; }
              }
              FixedDate.parse = OriginalDate.parse;
              FixedDate.UTC = OriginalDate.UTC;
              window.Date = FixedDate;
            });
            let response = null;
            try { response = await page.goto('http://127.0.0.1:4178/', { waitUntil: 'domcontentloaded', timeout: 15000 }); }
            catch (err) { fatalErrors.push('Navigation error: ' + (err.stack || err.message || String(err))); }
            await page.waitForTimeout(3500);
            const visibleBody = await page.evaluate(() => document.body.innerText || '').catch(() => '');
            const rootText = await page.locator('#root').innerText().catch(() => '');
            console.log('HTTP status:', response && response.status());
            console.log('Closing food safety root text:', rootText.slice(0, 6000));
            if (!response || response.status() >= 400) fatalErrors.push('Bad or missing HTTP response');
            if (/Application Error|before initialization|ReferenceError:/i.test(visibleBody)) fatalErrors.push('Visible application error');
            if (!rootText.trim()) fatalErrors.push('Staff app root is blank');
            if (!/晚班有效期标签检查|Closing Expiry Label Check/i.test(rootText)) fatalErrors.push('Closing food safety gate did not render for latest-end staff');
            if (fatalErrors.length) {
              console.error('\nCLOSING FOOD SAFETY SMOKE FAILED:\n' + fatalErrors.join('\n---\n'));
              await page.screenshot({ path: 'runtime-smoke-food-safety-closing-failure.png', fullPage: true }).catch(() => {});
              await browser.close();
              process.exit(1);
            }
            console.log('CLOSING FOOD SAFETY ROLE RUNTIME SMOKE PASSED');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-failure
          path: runtime-smoke-*-failure.png
          if-no-files-found: ignore
